<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e67"><title>臺灣日期計算器</title><link rel="stylesheet" href="style.css"><script src="data/calendar.js"></script><script src="core.js" defer></script><script src="app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">TAIWAN · DATE CALCULATOR</p><h1>臺灣日期計算器</h1></div><div id="today" class="today"></div></header>
<div class="data-bar"><span id="status">正在讀取日曆…</span><button id="refresh" class="quiet">重新讀取網站資料</button></div><p id="warning" class="warning" role="status"></p>
<div class="workspace"><section class="panel inputs"><div class="tabs" role="group" aria-label="計算功能"><button id="rangeTab" class="active" aria-pressed="true">日期間隔</button><button id="offsetTab" aria-pressed="false">推算日期</button></div>
<form id="form"><div class="field-grid"><label>開始／起算日期<input id="start" type="date" required></label><label id="endField">結束日期<input id="end" type="date" required></label><label id="amountField" hidden>天數<input id="amount" type="number" min="0" max="36600" step="1" value="10"></label></div>
<label id="directionField" hidden>推算方向<select id="direction"><option value="forward">往後推算</option><option value="back">往前推算</option></select></label>
<fieldset><legend>天數計算方式</legend><label class="radio"><input type="radio" name="mode" value="calendar" checked><span>日曆日<small>每一天都計算，包含假日</small></span></label><label class="radio"><input type="radio" name="mode" value="work"><span>工作日<small>依政府辦公日曆，跳過假日、計入補班</small></span></label></fieldset>
<div class="checks"><label><input id="includeStart" type="checkbox">計入開始／起算當天</label><label id="includeEndField"><input id="includeEnd" type="checkbox" checked>計入結束當天</label></div>
<label id="adjustField" hidden>推算結果遇假日<select id="adjust"><option value="none">不調整日期</option><option value="next">順延至下一個工作日</option><option value="previous">提前至上一個工作日</option></select></label>
<p id="ruleHint" class="muted"></p><button type="submit" class="primary">計算日期</button></form></section>
<section class="panel result" aria-live="polite"><p class="eyebrow" id="resultLabel">計算結果</p><div id="resultValue" class="result-value">—</div><p id="resultSub">選擇日期，開始計算。</p><div id="resultNote" class="result-note"></div><details id="detailBox" hidden><summary>逐日計算明細 <span id="detailCount"></span></summary><div class="table-scroll"><table><thead><tr><th>日期</th><th>是否計入</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></div></details></section></div>
<section class="panel settings"><details><summary>日曆來源與特殊休假設定</summary><p>工作日依政府行政機關辦公日曆。颱風等地區性臨時停班不會由年度日曆自動補入；可在下方自行設定。</p><p id="sourceMeta"></p><a href="https://data.gov.tw/dataset/14718" target="_blank" rel="noopener">查看官方資料集 ↗</a><div id="sourceList"></div><h2>特殊日期</h2><p class="muted">只影響這個瀏覽器，優先於已載入的官方日曆；不會上傳到 GitHub。</p><form id="overrideForm" class="override-form"><label>日期<input type="date" id="overrideDate" required></label><label>類型<select id="overrideType"><option value="holiday">休假／停班</option><option value="work">上班</option></select></label><label>原因<input id="overrideNote" maxlength="80" placeholder="例如：本機關臨時停班" required></label><button class="secondary" type="submit">加入設定</button></form><p id="overrideStatus" role="status"></p><ul id="overrideList"></ul><button id="export" class="quiet">匯出特殊日期備份</button> <label class="file-label">匯入特殊日期備份<input type="file" id="import" accept="application/json,.json"></label></details></section>
<footer>日期以臺灣時間顯示 · 支援民國年對照 · 計算規則由你選擇</footer></main></body></html>
